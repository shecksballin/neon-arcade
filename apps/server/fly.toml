# Neon Arcade game server on Fly.io — one machine per region, each region a
# separate player pool (matches/queues live in process memory). The client
# picks a region (account setup / settings); a request tagged for another
# region is re-delivered there via the fly-replay header (src/index.ts).
#
# Deploy from the REPO ROOT so the Docker build sees the workspace:
#   fly deploy --config apps/server/fly.toml --dockerfile apps/server/Dockerfile
app = "neonarcade-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Everything secret comes from `fly secrets` (see the deploy notes) —
  # only non-secrets belong here.
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Machines stay warm: an in-memory game region that autostops would drop
  # every live match in it. Scale-to-zero is wrong for this workload.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 2000
    soft_limit = 1500

[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
